openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: feed
    description: Personalized feed and post actions
  - name: discover
    description: People, communities, and topics
  - name: posts
    description: Post creation and interactions
  - name: communities
    description: Community membership
  - name: messages
    description: Private messaging
  - name: profiles
    description: Profile and notification data
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /feed:
    get:
      operationId: getFeed
      tags: [feed]
      summary: Get the personalized feed
      parameters:
        - in: query
          name: viewerId
          required: false
          schema:
            type: integer
            default: 1
      responses:
        "200":
          description: Feed posts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedResponse"
  /discover:
    get:
      operationId: getDiscover
      tags: [discover]
      summary: Search and browse discovery content
      parameters:
        - in: query
          name: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Discovery results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscoverResponse"
  /communities/{communityId}:
    get:
      operationId: getCommunity
      tags: [discover]
      summary: Get a community page
      parameters:
        - in: path
          name: communityId
          required: true
          schema:
            type: integer
        - in: query
          name: viewerId
          required: false
          schema: { type: integer, default: 1 }
      responses:
        "200":
          description: Community detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommunityDetail"
        "404":
          description: Community not found
  /posts:
    post:
      operationId: createPost
      tags: [posts]
      summary: Create a text, image, or video post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePostRequest"
      responses:
        "201":
          description: Created post
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"
  /posts/{postId}/like:
    post:
      operationId: togglePostLike
      tags: [posts]
      summary: Like or unlike a post
      parameters:
        - in: path
          name: postId
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LikeRequest"
      responses:
        "200":
          description: Updated like state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LikeResponse"
  /posts/{postId}:
    get:
      operationId: getPost
      tags: [posts]
      summary: Get a post by ID
      parameters:
        - in: path
          name: postId
          required: true
          schema: { type: integer }
        - in: query
          name: viewerId
          required: false
          schema: { type: integer, default: 1 }
      responses:
        "200":
          description: Post detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Post" }
        "404": { description: Post not found }
  /posts/{postId}/comments:
    get:
      operationId: getPostComments
      tags: [posts]
      summary: Get persisted comments for a post
      parameters:
        - in: path
          name: postId
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Post comments
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommentsResponse" }
    post:
      operationId: createPostComment
      tags: [posts]
      summary: Add a comment or reply to a post
      parameters:
        - in: path
          name: postId
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateCommentRequest" }
      responses:
        "201":
          description: Created comment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Comment" }
  /profiles/{profileId}/follow:
    post:
      operationId: toggleFollow
      tags: [profiles]
      summary: Follow or unfollow a profile
      parameters:
        - in: path
          name: profileId
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ViewerRequest" }
      responses:
        "200":
          description: Updated follow state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FollowResponse" }
  /communities/{communityId}/membership:
    post:
      operationId: toggleCommunityMembership
      tags: [communities]
      summary: Join or leave a community
      parameters:
        - in: path
          name: communityId
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ViewerRequest" }
      responses:
        "200":
          description: Updated membership state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MembershipResponse" }
  /messages:
    get:
      operationId: getMessages
      tags: [messages]
      summary: Get message conversations
      parameters:
        - in: query
          name: viewerId
          required: false
          schema:
            type: integer
            default: 1
      responses:
        "200":
          description: Conversations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessagesResponse"
    post:
      operationId: sendMessage
      tags: [messages]
      summary: Send a private message
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendMessageRequest"
      responses:
        "201":
          description: Sent message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
  /conversations/{conversationId}/messages:
    get:
      operationId: getConversationMessages
      tags: [messages]
      summary: Get persisted messages in a conversation
      parameters:
        - in: path
          name: conversationId
          required: true
          schema: { type: integer }
        - in: query
          name: viewerId
          required: false
          schema: { type: integer, default: 1 }
      responses:
        "200":
          description: Conversation messages
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConversationMessagesResponse" }
  /profiles/{profileId}:
    get:
      operationId: getProfile
      tags: [profiles]
      summary: Get a user profile
      parameters:
        - in: path
          name: profileId
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
  /profiles/{profileId}/notifications:
    get:
      operationId: getNotifications
      tags: [profiles]
      summary: Get profile notifications
      parameters:
        - in: path
          name: profileId
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Notifications
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationsResponse"
  /profiles/{profileId}/notifications/read:
    post:
      operationId: markNotificationsRead
      tags: [profiles]
      summary: Mark one or all notifications as read
      parameters:
        - in: path
          name: profileId
          required: true
          schema: { type: integer }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MarkNotificationsReadRequest" }
      responses:
        "200":
          description: Notifications marked as read
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MarkNotificationsReadResponse" }
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Community:
      type: object
      required: [id, name, slug, color, memberCount, description]
      properties:
        id: { type: integer }
        name: { type: string }
        slug: { type: string }
        color: { type: string }
        memberCount: { type: integer }
        description: { type: string }
    Author:
      type: object
      required: [id, displayName, username, avatar, communityName, communityColor, isLive]
      properties:
        id: { type: integer }
        displayName: { type: string }
        username: { type: string }
        avatar: { type: string }
        communityName: { type: string }
        communityColor: { type: string }
        isLive: { type: boolean }
        isPremium: { type: boolean }
    Post:
      type: object
      required: [id, author, type, text, caption, mediaUrl, createdAt, likes, comments, shares, likedByViewer]
      properties:
        id: { type: integer }
        author: { $ref: "#/components/schemas/Author" }
        type:
          type: string
          enum: [text, image, video]
        text: { type: string }
        caption: { type: string }
        mediaUrl: { type: string }
        link: { type: string, nullable: true }
        createdAt: { type: string }
        likes: { type: integer }
        comments: { type: integer }
        shares: { type: integer }
        likedByViewer: { type: boolean }
    ViewerRequest:
      type: object
      required: [viewerId]
      properties:
        viewerId: { type: integer, minimum: 1 }
    FollowResponse:
      type: object
      required: [following, followerCount]
      properties:
        following: { type: boolean }
        followerCount: { type: integer }
    MembershipResponse:
      type: object
      required: [joined, memberCount]
      properties:
        joined: { type: boolean }
        memberCount: { type: integer }
    Comment:
      type: object
      required: [id, postId, author, body, createdAt, parentCommentId]
      properties:
        id: { type: integer }
        postId: { type: integer }
        author: { $ref: "#/components/schemas/Author" }
        body: { type: string }
        createdAt: { type: string }
        parentCommentId: { type: integer, nullable: true }
    CommentsResponse:
      type: object
      required: [comments]
      properties:
        comments:
          type: array
          items: { $ref: "#/components/schemas/Comment" }
    CreateCommentRequest:
      type: object
      required: [authorId, body]
      properties:
        authorId: { type: integer, minimum: 1 }
        body: { type: string, minLength: 1, maxLength: 1000 }
        parentCommentId: { type: integer, nullable: true }
    ConversationMessagesResponse:
      type: object
      required: [messages]
      properties:
        messages:
          type: array
          items: { $ref: "#/components/schemas/Message" }
    FeedResponse:
      type: object
      required: [posts, viewer]
      properties:
        posts:
          type: array
          items: { $ref: "#/components/schemas/Post" }
        viewer: { $ref: "#/components/schemas/Author" }
    DiscoverResponse:
      type: object
      required: [communities, people, topics]
      properties:
        communities:
          type: array
          items: { $ref: "#/components/schemas/Community" }
        people:
          type: array
          items: { $ref: "#/components/schemas/Author" }
        topics:
          type: array
          items: { type: string }
    CommunityDetail:
      type: object
      required: [community, members, posts]
      properties:
        community: { $ref: "#/components/schemas/Community" }
        joinedByViewer: { type: boolean }
        members:
          type: array
          items: { $ref: "#/components/schemas/Author" }
        posts:
          type: array
          items: { $ref: "#/components/schemas/Post" }
    CreatePostRequest:
      type: object
      required: [authorId, type]
      properties:
        authorId: { type: integer }
        type:
          type: string
          enum: [text, image, video]
        text: { type: string, maxLength: 500 }
        caption: { type: string }
        mediaUrl: { type: string }
        link:
          type: string
          pattern: '^https?://[^\\s]+$'
    LikeRequest:
      type: object
      required: [viewerId]
      properties:
        viewerId: { type: integer }
    LikeResponse:
      type: object
      required: [liked, likes]
      properties:
        liked: { type: boolean }
        likes: { type: integer }
    Message:
      type: object
      required: [id, senderId, recipientId, body, createdAt, status]
      properties:
        id: { type: integer }
        senderId: { type: integer }
        recipientId: { type: integer }
        body: { type: string }
        createdAt: { type: string }
        status:
          type: string
          enum: [sent, delivered, read]
    Conversation:
      type: object
      required: [id, person, lastMessage, unreadCount, updatedAt]
      properties:
        id: { type: integer }
        person: { $ref: "#/components/schemas/Author" }
        lastMessage: { type: string }
        unreadCount: { type: integer }
        updatedAt: { type: string }
    MessagesResponse:
      type: object
      required: [conversations]
      properties:
        conversations:
          type: array
          items: { $ref: "#/components/schemas/Conversation" }
    SendMessageRequest:
      type: object
      required: [senderId, recipientId, body]
      properties:
        senderId: { type: integer }
        recipientId: { type: integer }
        body: { type: string }
    Profile:
      type: object
      required: [user, followerCount, followingCount, posts]
      properties:
        user: { $ref: "#/components/schemas/Author" }
        followerCount: { type: integer }
        followingCount: { type: integer }
        posts:
          type: array
          items: { $ref: "#/components/schemas/Post" }
    AppNotification:
      type: object
      required: [id, kind, title, detail, createdAt, read]
      properties:
        id: { type: integer }
        kind:
          type: string
          enum: [like, comment, follow, live, message, community]
        title: { type: string }
        detail: { type: string }
        createdAt: { type: string }
        read: { type: boolean }
    NotificationsResponse:
      type: object
      required: [notifications]
      properties:
        notifications:
          type: array
          items: { $ref: "#/components/schemas/AppNotification" }
    MarkNotificationsReadRequest:
      type: object
      properties:
        notificationId: { type: integer, minimum: 1 }
    MarkNotificationsReadResponse:
      type: object
      required: [updated]
      properties:
        updated: { type: integer }

