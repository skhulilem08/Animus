kind = "mobile"
previewPath = "/"
title = "Animus"
description = "A community-centered social mobile app where people share text, images, and clips, discover communities, message each other, and connect across community boundaries."
version = "1.0.0"
id = "artifacts/animus"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/" ]
localPort = 21763

[services.development]
run = "pnpm --filter @workspace/animus run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/animus", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/animus", "run", "serve" ]

[services.env]
PORT = "21763"
BASE_PATH = "/"
